# EKP reverse proxy: serves the SPA, proxies /api to FastAPI, terminates TLS.
# Mounted at /etc/nginx/conf.d/default.conf. Certs live in ./nginx/certs
# (self-signed via `make certs`, or drop in Let's Encrypt fullchain/privkey).

server {
    listen 80;
    server_name _;
    # redirect everything to https so proposal links are always encrypted
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # uploads: 5 files × 25 MB + form overhead
    client_max_body_size 130m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: never buffer, allow long-lived streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;   # SPA routes (/p/…, /admin, /viewer/…)
    }
}
