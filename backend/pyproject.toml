[project]
name = "ekp-backend"
version = "0.1.0"
description = "Enterprise Knowledge Platform — FastAPI backend (ingestion + RAG demo)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "fastembed>=0.3.6",
    "langchain-text-splitters>=0.3",
    "langchain-google-genai>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.services"]

[tool.setuptools.package-data]
app = ["schema.sql"]
